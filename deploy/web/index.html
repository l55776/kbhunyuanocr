<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HunyuanOCR 本地识别台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg0:#070b14; --bg1:#0d1424; --panel:rgba(255,255,255,.04);
    --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09);
    --tx:#e8ecf4; --tx2:#9aa5b8; --ac1:#7c5cff; --ac2:#2dd4bf;
    --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
    --mono:"Cascadia Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;color:var(--tx);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%,rgba(124,92,255,.18),transparent 60%),
      radial-gradient(900px 460px at 110% 0%,rgba(45,212,191,.12),transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg0) 70%);
  }
  header{display:flex;align-items:center;gap:12px;padding:18px 26px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;background:rgba(7,11,20,.72)}
  .logo{width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--ac1),var(--ac2));
    display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 4px 18px rgba(124,92,255,.4)}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .sub{font-size:12px;color:var(--tx2);margin-top:2px}
  .chip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(248,113,113,.5)}
  .dot.on{background:var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  main{display:grid;grid-template-columns:390px 1fr;gap:18px;padding:20px 26px;max-width:1560px;margin:0 auto}
  @media (max-width:1020px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx2);margin:0 0 12px;font-weight:600}
  .drop{position:relative;border:1.5px dashed rgba(255,255,255,.18);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.15s;background:var(--panel)}
  .drop:hover,.drop.drag{border-color:var(--ac1);background:rgba(124,92,255,.06)}
  .drop img{max-width:100%;max-height:280px;border-radius:8px;display:block;margin:0 auto}
  .drop .ph{color:var(--tx2);font-size:13px;padding:26px 8px}
  .drop .ph b{color:var(--tx);display:block;font-size:14px;margin-bottom:6px}
  .drop input{display:none}
  .meta{font-size:11px;color:var(--tx2);margin-top:8px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .row{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
  .chipbtn{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer;transition:.15s}
  .chipbtn:hover{border-color:var(--ac1);color:var(--tx)}
  .chipbtn.on{background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(45,212,191,.22));border-color:transparent;color:#fff}
  label.fl{font-size:12px;color:var(--tx2);display:block;margin:10px 0 5px}
  textarea.in{width:100%;min-height:86px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0a0f1c;color:var(--tx);padding:10px;font-size:13px;line-height:1.55;font-family:var(--mono);outline:none}
  textarea.in:focus{border-color:var(--ac1)}
  .mini{display:flex;gap:10px}
  .mini > div{flex:1}
  input.in{width:100%;border-radius:10px;border:1px solid var(--line);background:#0a0f1c;color:var(--tx);padding:8px 10px;font-size:12.5px;outline:none}
  input.in:focus{border-color:var(--ac1)}
  .actions{display:flex;gap:10px;margin-top:14px}
  button{appearance:none;border:0;cursor:pointer}
  .btn{flex:1;padding:11px 0;border-radius:11px;font-size:14px;font-weight:650;color:#fff;background:linear-gradient(135deg,var(--ac1),var(--ac2));box-shadow:0 6px 22px rgba(124,92,255,.35);transition:.15s}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 26px rgba(124,92,255,.45)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{flex:0 0 auto;padding:11px 16px;background:var(--panel2);box-shadow:none;border:1px solid var(--line);font-weight:550}
  .btn.ghost:hover{background:var(--panel)}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .stat{font-size:12px;color:var(--tx2);margin-left:auto;font-variant-numeric:tabular-nums}
  .tabsel{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .tabsel button{background:transparent;color:var(--tx2);padding:6px 14px;font-size:12.5px;border-right:1px solid var(--line)}
  .tabsel button.on{color:#fff;background:var(--panel2)}
  #outWrap{position:relative;min-height:420px;max-height:calc(100vh - 230px);overflow:auto;border-radius:12px;border:1px solid var(--line);background:#0a0f1c;padding:16px 20px;line-height:1.7;font-size:14px}
  #outWrap .placeholder{color:#5b6577;text-align:center;padding:90px 10px;font-size:13px;line-height:2}
  #outWrap .busy::after{content:"";display:inline-block;width:7px;height:14px;margin-left:3px;background:var(--ac2);animation:blink 1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
  #outWrap table{border-collapse:collapse;margin:10px 0}
  #outWrap td,#outWrap th{border:1px solid rgba(255,255,255,.25);padding:4px 9px;font-size:13px}
  #outWrap code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px}
  #outWrap pre{background:#0c1222;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
  #outWrap pre code{background:none;padding:0}
  #outWrap blockquote{border-left:3px solid var(--ac1);margin:8px 0;padding-left:12px;color:var(--tx2)}
  #rawBox{display:none;white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#c9d4e6;min-height:420px;max-height:calc(100vh - 230px);overflow:auto;border-radius:12px;border:1px solid var(--line);background:#0a0f1c;padding:16px 20px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:#1b2337;border:1px solid var(--line);padding:10px 18px;border-radius:11px;font-size:13px;z-index:99;transition:.25s;opacity:0;pointer-events:none;max-width:80vw}
  .toast.show{transform:translateX(-50%);opacity:1}
  .loader{display:inline-flex;gap:4px;margin-left:4px}
  .loader i{width:5px;height:5px;border-radius:50%;background:var(--ac2);animation:b 1s infinite}
  .loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  footer{color:#4d5768;font-size:12px;text-align:center;padding:16px}
  a{color:#8b9cc4}
</style>
</head>
<body>

<header>
  <div class="logo">H</div>
  <div>
    <h1>HunyuanOCR 本地识别台</h1>
    <div class="sub">文档 · 公式 · 表格 · 版面 → Markdown / LaTeX / HTML</div>
  </div>
  <div class="chip"><span class="dot" id="dot"></span><span id="srvTxt">检测服务中…</span></div>
</header>

<main>
  <!-- ============ 左侧：输入 ============ -->
  <section>
    <div class="card">
      <h2>① 上传图片</h2>
      <div class="drop" id="drop">
        <input type="file" id="file" accept="image/*" />
        <div class="ph" id="dropPh"><b>点击或拖拽图片到此处</b>支持 JPG / PNG / WebP</div>
        <img id="preview" alt="" style="display:none" />
      </div>
      <div class="meta">
        <span id="imgInfo">未选择图片</span>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
          <input type="checkbox" id="doResize" checked style="accent-color:var(--ac1)" /> 自动压缩 ≤1600px
        </label>
      </div>

      <h2 style="margin-top:18px">② 识别任务</h2>
      <div class="row" id="presets">
        <button class="chipbtn on" data-p="doc">通用文档解析</button>
        <button class="chipbtn" data-p="formula">公式 LaTeX</button>
        <button class="chipbtn" data-p="table">表格 HTML</button>
        <button class="chipbtn" data-p="layout">版面结构</button>
        <button class="chipbtn" data-p="slip">单据 JSON</button>
      </div>
      <label class="fl">提示词（可自行修改）</label>
      <textarea class="in" id="prompt"></textarea>
      <div class="mini">
        <div><label class="fl">max_tokens</label><input class="in" id="mtokens" type="number" value="2048" min="128" max="8192" /></div>
        <div><label class="fl">服务地址（默认同源）</label><input class="in" id="base" placeholder="http://127.0.0.1:8099" /></div>
      </div>

      <label style="display:flex;align-items:center;gap:6px;margin:12px 2px 0;font-size:12px;color:var(--tx2);cursor:pointer" title="勾选后只发一次 HTTP 请求：模型一次性生成完整内容并在结束时整体返回，适合结构化的 JSON 结果；取消勾选则恢复流式增量显示">
        <input type="checkbox" id="doOnce" checked style="accent-color:var(--ac1)" /> 一次性返回完整 JSON（不流式）
      </label>

      <div class="actions">
        <button class="btn ghost" id="demoBtn" style="flex:0 0 auto">示例图</button>
        <button class="btn" id="runBtn" disabled>开始识别</button>
        <button class="btn ghost" id="stopBtn" style="display:none">停止</button>
      </div>
    </div>
  </section>

  <!-- ============ 右侧：结果 ============ -->
  <section>
    <div class="card">
      <div class="toolbar">
        <div class="tabsel">
          <button class="on" data-v="pre">预览</button>
          <button data-v="raw">Markdown 源码</button>
        </div>
        <button class="btn ghost" id="copyBtn" style="padding:6px 12px">复制</button>
        <span class="stat" id="stat">等待开始…</span>
      </div>
      <div id="outWrap"><div class="placeholder">识别结果将在这里实时显示<br/>本地 CPU 推理，整页文档约需 3~10 分钟，请耐心等待 ✋<br/><br/><b style="color:#8b9cc4">提示：</b>页面会边生成边刷新，请留意左侧“流式输出”进度</div></div>
      <div id="rawBox"></div>
    </div>
  </section>
</main>

<footer>HunyuanOCR · llama.cpp 本地服务 · OpenAI 兼容接口 /v1/chat/completions</footer>
<div class="toast" id="toast"></div>

<script>
/* ================= 基础状态 ================= */
const $ = id => document.getElementById(id);
const PROMPTS = {
  doc:     "提取文档图片中正文的所有信息用markdown格式表示，其中页眉、页脚部分忽略，表格用html格式表达，文档中公式用latex格式表示，按照阅读顺序组织进行解析。",
  formula: "请识别文档图片中的正文与公式，正文简要概括，公式输出为可直接编译的 LaTeX 代码（行内 $...$、独立公式 $$...$$），按阅读顺序组织。",
  table:   "识别图片中的所有表格：还原表头、行列与单元格，用完整 HTML <table> 结构输出；表格以外的正文用 markdown 简要概括。",
  layout:  "对该文档页面做版面分析，按 标题 / 段落 / 列表 / 图片说明 / 表格 / 公式 / 页眉页脚 分块，用 markdown 标题和引用清晰组织输出。",
  slip: `你是医药购销/出入库单据的 OCR 结构化解析引擎。仅依据图片输出 1 个合法的 JSON 对象：使用标准 JSON 双引号，不要 markdown 代码块，不要任何前后缀文字或解释。

输出的 JSON 必须直接以 { 开始、以 } 结束，严禁使用 markdown 代码块围栏（不要加语言标签，不要用反引号把 JSON 括起来），严禁任何前后缀文字或解释。

【第一步 单据头】从图片整体信息读取，均为字符串，缺失给空字符串 ""：
- billNo：单据编号（如 Y1058）
- date：开单日期，保留原样（如 2026年3月26日）
- warehouse：仓库/配送单位/收货单位名称
- cvendername：表头或票头中供货单位公司全称（如 "安徽福仁堂医药有限公司"）

【第二步 表格】逐行识别：表格每一行数据对应 goodsList 中的一个对象，行序与图片一致。请先清点表格中包含几行数据，再逐行完整输出，goodsList 的对象数量必须等于实际数据行数，逐行追加，一个都不能漏、不能合并、不能只输出第一行。表头按下列字段映射为键名，再把该行对应单元格的值逐格填入：
映射：tableHeaderMap = { "代码":"cgoodsid","商品编码":"cgoodsid","名称":"cgoodsname","药品名称":"cgoodsname","商品名称":"cgoodsname","通用名称":"cgoodsname","规格":"cpkname","产品规格":"cpkname","规格型号":"cpkname","剂型":"dosageForm","生产厂家/上市许可证持有人":"cfactoryname","生产厂家":"cfactoryname","注册证号":"cfactoryno","批准文号":"cfactoryno","单位":"cunit","数量":"fqty","出库数量":"fqty","单价":"fprice","金额":"amount","批号":"cph","产品批号":"cph","有效期至":"dexpdate","有效期":"dexpdate","生产日期":"dmadedate","uuid":"uuid" }
未出现在映射中的表头，键名保持原文字段名。对齐：表头顺序必须严格与图片列顺序一致，逐列取值，严禁错位。

【第三步 键与类型】每个对象只包含该行实际存在表头所映射的键；图片中没有的列，绝对不要输出对应键（尤其不要凭空出现 dosageForm、dmadedate、uuid 等键）。fqty/fprice/amount 用数字（去掉￥、逗号与单位，空给 0）；其余字段保持字符串原样。

【注意】表格最后的"合计/总计/小计"行以及页眉、页脚、表外文字一律不要计入 goodsList。

输出结构（goodsList 应包含表格中所有数据行；下面示例仅示意字段，实际按映射生成且键可省略）：
{"billNo":"","date":"","warehouse":"","cvendername":"","goodsList":[{"cgoodsid":"","cgoodsname":"","cpkname":"","cfactoryname":"","cfactoryno":"","cunit":"","cph":"","dmadedate":"","dexpdate":"","fqty":0,"fprice":0,"amount":0},{"cgoodsid":"","cgoodsname":"","fqty":0,"amount":0}]}`
};
let imgDataUrl = null;      // 待发送的图片 dataURL
let running = false, ac = null, timer = null, t0 = 0, mode = "pre";
let lastNote = "";   // 结束时的附加提示（如 max_tokens 截断）
let demoSupported = location.protocol !== "file:";

function baseUrl(){
  const b = ($("base").value || "").trim();
  const def = location.protocol === "file:" ? "http://127.0.0.1:8099" : "";
  const origin = (b || def).replace(/\/+$/,"");
  return origin;
}

$("prompt").value = PROMPTS.doc;

/* ================= 服务状态 ================= */
async function ping(){
  const url = baseUrl() + "/v1/models";
  try{
    const r = await fetch(url, {signal: AbortSignal.timeout(4000)});
    if(!r.ok) throw 0;
    const j = await r.json();
    $("dot").classList.add("on");
    $("srvTxt").textContent = "服务在线 · " + (j.data?.[0]?.id || "model") + " @ " + url.replace(/^https?:\/\//,"").replace(/\/v1.*$/,"");
  }catch(e){
    $("dot").classList.remove("on");
    $("srvTxt").textContent = "服务未连接 · 请先启动 llama-server";
  }
}
setInterval(()=>{ if(!running) ping(); }, 6000); ping();

/* ================= 图片选择 ================= */
function readFile(file){
  if(!file || !/^image\//.test(file.type)){ toast("请选择图片文件"); return; }
  const rd = new FileReader();
  rd.onload = () => prepImage(rd.result);
  rd.readAsDataURL(file);
}
function prepImage(dataUrl){
  const img = new Image();
  img.onload = () => {
    const doResize = $("doResize").checked;
    const MAX = 1600;
    let w = img.naturalWidth, h = img.naturalHeight;
    if(doResize && Math.max(w,h) > MAX){
      const k = MAX / Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k);
    }
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    imgDataUrl = cv.toDataURL("image/jpeg", 0.9);
    const bytes = Math.round(imgDataUrl.length * 3/4);
    $("preview").src = imgDataUrl; $("preview").style.display = "block";
    $("dropPh").style.display = "none";
    $("imgInfo").textContent = (img.naturalWidth+"×"+img.naturalHeight) + " → " + w + "×" + h + "  ·  " + fmtSize(bytes);
    $("runBtn").disabled = false;
  };
  img.src = dataUrl;
}
const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => e.target.files[0] && readFile(e.target.files[0]));
["dragover","dragleave"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.toggle("drag", ev==="dragover"); }));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("drag"); readFile(e.dataTransfer.files[0]); });

/* 示例图（需通过 http 打开才可加载） */
$("demoBtn").addEventListener("click", async () => {
  if(!demoSupported){ toast("示例图需通过 http:// 打开页面才能加载（请用 8099 或 5500 端口访问）"); return; }
  try{
    const r = await fetch("sample_ocr.jpg"); if(!r.ok) throw 0;
    const blob = await r.blob();
    const rd = new FileReader();
    rd.onload = () => { prepImage(rd.result); toast("已加载示例文档页"); };
    rd.readAsDataURL(blob);
  }catch(e){ toast("示例图加载失败"); }
});

/* ================= 提示词预设 ================= */
document.querySelectorAll("#presets .chipbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#presets .chipbtn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    $("prompt").value = PROMPTS[btn.dataset.p];
    if(btn.dataset.p === "slip") $("doOnce").checked = true;   // JSON 任务默认一次性完整返回
  });
});

/* ================= Markdown + LaTeX 渲染 ================= */
let renderTimer = null, mdText = "";
function protectMath(src){
  console.log('src',src)
  const blocks = [];
  const ph = m => "@@KX" + (blocks.push(m)-1) + "@@";
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_,c) => ph("$$"+c+"$$"));
  src = src.replace(/\\\[([\s\S]+?)\\\]/g, (_,c) => ph("\\["+c+"\\]"));
  src = src.replace(/(?<!\\)\$(?!\$)([^$\n]+?)\$(?!\$)/g, (_,c) => ph("$"+c+"$"));
  src = src.replace(/\\\(([\s\S]+?)\\\)/g, (_,c) => ph("\\("+c+"\\)"));
  return {src, blocks};
}
function renderMarkdown(src){
  const {src:s, blocks} = protectMath(src);
    console.log('src',s,blocks)
  let html;
  try{ html = window.marked ? marked.parse(s, {breaks:true, gfm:true}) : null; }
  catch(e){ html = null; }
  if(html == null) return null;                       // CDN 不可用时交给纯文本
  html = html.replace(/@@KX(\d+)@@/g, (_,i)=>blocks[+i]);
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  if(window.renderMathInElement){
    try{ renderMathInElement(tmp, {delimiters:[
      {left:"$$", right:"$$", display:true},
      {left:"\\[", right:"\\]", display:true},
      {left:"$", right:"$", display:false},
      {left:"\\(", right:"\\)", display:false}
    ], throwOnError:false}); }catch(e){}
  }
  return tmp.innerHTML;
}
function scheduleRender(){
  if(running && renderTimer == null){
    renderTimer = setTimeout(() => { renderTimer = null; paint(); }, 350);
  }
}
function paint(){
  const wrap = $("outWrap");
  const busy = running ? '<span class="loader"><i></i><i></i><i></i></span>' : "";
  if(mdText === ""){
    $("rawBox").textContent = "";
    return;                              // 保留现有占位 / 错误提示
  }
  if(mode === "pre"){
    const html = mdText ? renderMarkdown(mdText) : null;
    if(html != null){ wrap.innerHTML = html + busy; }
    else { wrap.innerHTML = "<pre style='font-family:var(--mono)'>" + esc(mdText) + "</pre>" + busy; }
    wrap.scrollTop = wrap.scrollHeight;
  }
  $("rawBox").textContent = mdText;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function cleanJson(s){   // 若模型仍输出 ```json 围栏，则去掉，拿到纯 JSON
  return s.trim().replace(/^```[a-zA-Z]*\s*/,"").replace(/\s*```\s*$/,"").trim();
}

/* ================= 主流程：流式调用 ================= */
async function run(){
  if(running) return;
  if(!imgDataUrl){ toast("请先选择图片"); return; }
  const api = baseUrl() + "/v1/chat/completions";
  ac = new AbortController();
  running = true; t0 = performance.now(); lastNote = "";
  mdText = ""; $("rawBox").textContent = "";
  $("outWrap").innerHTML = '<div class="placeholder">正在提交并解析图片…<div style="margin-top:10px"><span class="loader"><i></i><i></i><i></i></span></div></div>';
  $("runBtn").disabled = true; $("runBtn").textContent = "识别中";
  $("stopBtn").style.display = "inline-block"; $("demoBtn").disabled = true;
  $("stat").textContent = "解析图片中… 0 字符 · 0s";
  timer = setInterval(() => {               // 秒表
    const s = Math.floor((performance.now()-t0)/1000);
    $("stat").textContent = (mdText ? "生成中" : "解析图片中") + " · " + mdText.length + " 字符 · " + mmss(s);
  }, 1000);

  const once = $("doOnce").checked;
  const payload = {
    model: "hunyuanocr",
    messages: [{ role:"user", content:[
      { type:"image_url", image_url:{ url: imgDataUrl } },
      { type:"text", text: $("prompt").value.trim() }
    ]}],
    max_tokens: Math.max(64, parseInt($("mtokens").value)||2048),
    temperature: 0,
    stream: !once            // 勾选"一次性返回" → stream:false，单次响应直接返回完整 JSON
  };
  try{
    const res = await fetch(api, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload), signal: ac.signal
    });
    if(!res.ok){
      const t = await res.text().catch(()=>"");
      throw new Error("HTTP " + res.status + (t ? "：" + t.slice(0,200) : ""));
    }
    if(once){
      // —— 一次性返回：一个 HTTP 响应即包含完整结果 ——
      const j = await res.json();
      const msg = j?.choices?.[0]?.message?.content;
      finalize(msg != null ? String(msg) : "", j?.choices?.[0]?.finish_reason === "length");
    } else {
      // —— 流式（SSE）：逐 chunk 追加显示 ——
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      if(ct.indexOf("application/json") >= 0){   // 服务端意外返回非流式时的兜底
        const j = await res.json();
        const m = j?.choices?.[0]?.message?.content;
        finalize(m != null ? String(m) : "", false);
      } else {
        const reader = res.body.getReader(); const dec = new TextDecoder();
        let buf = "";
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          buf += dec.decode(value, {stream:true});
          let nl;
          while((nl = buf.indexOf("\n")) >= 0){
            const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
            if(!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if(data === "[DONE]") continue;
            try{
              const d = JSON.parse(data).choices?.[0]?.delta?.content;
              if(d){ mdText += d; scheduleRender(); }
            }catch(e){/* 忽略半行 */}
          }
        }
        finalize(mdText, false);
      }
    }
  }catch(e){
    if(e.name === "AbortError") finish("已停止");
    else { showErr(e.message); finish("出错"); }
  }
}
function finalize(content, truncated){          // 统一收尾：去围栏 → 整理 JSON → 完成
  mdText = cleanJson(content || "");
  lastNote = truncated ? " · ⚠ max_tokens 截断，JSON 可能不完整" : "";
  try{ const o = JSON.parse(mdText); if(o && typeof o === "object") mdText = JSON.stringify(o, null, 2); }catch(e){}
  finish("完成");
}
function finish(st){
  running = false; clearInterval(timer); timer = null;
  $("runBtn").disabled = false; $("runBtn").textContent = "开始识别";
  $("stopBtn").style.display = "none"; $("demoBtn").disabled = false;
  const s = Math.floor((performance.now()-t0)/1000);
  $("stat").textContent = st + " · " + mdText.length + " 字符 · 耗时 " + mmss(s) + lastNote;
  if(mdText === "" && st !== "完成"){
    $("outWrap").innerHTML = '<div class="placeholder">' + (st === "已停止" ? "已手动停止" : "未生成内容") + '<br/><br/>可点击左侧“开始识别”重试</div>';
  }
  paint();
}
function showErr(msg){
  $("outWrap").innerHTML = "<div class='placeholder' style='color:var(--bad)'>请求失败：" + esc(msg) + "<br/><br/><a href='javascript:ping()'>重新检测服务</a></div>";
}
$("runBtn").addEventListener("click", run);
$("stopBtn").addEventListener("click", () => ac && ac.abort());

/* 视图切换 / 复制 */
document.querySelectorAll(".tabsel button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabsel button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  mode = b.dataset.v;
  const pre = mode === "pre";
  $("outWrap").style.display = pre ? "block" : "none";
  $("rawBox").style.display = pre ? "none" : "block";
  paint();
}));
$("copyBtn").addEventListener("click", async () => {
  if(!mdText){ toast("暂无可复制的内容"); return; }
  try{ await navigator.clipboard.writeText(mdText); toast("已复制 Markdown 到剪贴板"); }
  catch(e){
    const ta = $("rawBox"); ta.style.display="block"; ta.select();
    document.execCommand("copy"); toast("已复制");
  }
});
/* 方便 Markdown 源码页也能看到内容 */
setInterval(()=>{ if(!running && mdText) { $("rawBox").textContent = mdText; } }, 500);

/* ================= 工具 ================= */
let toastTimer;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
function mmss(s){ const m = Math.floor(s/60); return m + "分" + String(s%60).padStart(2,"0") + "秒"; }
function fmtSize(b){ return b > 1024*1024 ? (b/1048576).toFixed(2)+" MB" : Math.max(1, Math.round(b/1024))+" KB"; }
</script>
